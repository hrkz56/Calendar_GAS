<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #202124; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px 32px; }
    .card { background: #fff; border: 1px solid #dadce0; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(60,64,67,.1); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .sub { color: #5f6368; margin-bottom: 16px; }
    textarea { width: 100%; height: 280px; box-sizing: border-box; padding: 12px; border: 1px solid #bdc1c6; border-radius: 6px; resize: vertical; font-family: monospace; font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-top: 12px; }
    label { display: block; font-size: 13px; color: #5f6368; margin-bottom: 4px; }
    input[type="number"], select { padding: 9px 10px; border: 1px solid #bdc1c6; border-radius: 6px; }
    input[type="number"] { width: 110px; }
    select { min-width: 260px; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .primary { background: #1a73e8; color: #fff; }
    .success { background: #188038; color: #fff; }
    .danger { background: #b3261e; color: #fff; }
    .secondary { background: #e8f0fe; color: #1967d2; }
    button:disabled { opacity: .6; cursor: default; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .metric { background: #f8fafd; border: 1px solid #e0e3e7; border-radius: 8px; padding: 12px; }
    .metric strong { display: block; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e0e3e7; padding: 9px 8px; text-align: left; vertical-align: top; }
    th { background: #f8fafd; position: sticky; top: 0; }
    .table-wrap { max-height: 420px; overflow: auto; border: 1px solid #e0e3e7; border-radius: 6px; }
    .error { color: #b3261e; white-space: pre-wrap; margin: 10px 0; }
    .warning { color: #8a4b00; white-space: pre-wrap; margin: 10px 0; }
    .ok { color: #137333; white-space: pre-wrap; margin: 10px 0; }
    .hidden { display: none; }
    .category-grid { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 8px; }
    .category-item { display: flex; align-items: center; gap: 5px; }
    .section-label { margin-top: 14px; font-size: 13px; color: #5f6368; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Calendar_GAS Ver1.0</h1>
      <div class="sub">Phase4 Final：重複防止・カテゴリ選択・カレンダー選択・月単位削除</div>

      <textarea id="scheduleText" placeholder="ここへ勤務表を貼り付けてください。"></textarea>

      <div class="row">
        <div>
          <label for="year">対象年</label>
          <input id="year" type="number" min="2000" max="2100">
        </div>
        <div>
          <label for="calendarSelect">登録先カレンダー</label>
          <select id="calendarSelect"></select>
        </div>
      </div>

      <div class="section-label">登録対象カテゴリ</div>
      <div id="categoryArea" class="category-grid"></div>

      <div class="row">
        <button id="previewBtn" class="primary" onclick="runPreview()">プレビュー</button>
        <button id="registerBtn" class="success" onclick="runRegistration()">Googleカレンダーへ登録</button>
        <button class="secondary" onclick="loadSample()">サンプル入力</button>
      </div>
    </div>

    <div class="card">
      <h2>月単位削除</h2>
      <div class="row">
        <div>
          <label for="deleteYear">年</label>
          <input id="deleteYear" type="number" min="2000" max="2100">
        </div>
        <div>
          <label for="deleteMonth">月</label>
          <input id="deleteMonth" type="number" min="1" max="12">
        </div>
        <button id="deleteBtn" class="danger" onclick="runMonthDelete()">選択カテゴリの予定を削除</button>
      </div>
      <div class="sub" style="margin-top:10px;">Calendar_GASで作成したと判定できる予定のみ削除します。</div>
    </div>

    <div id="resultCard" class="card hidden">
      <h2>解析結果</h2>
      <div id="summary" class="summary"></div>
      <div id="messages"></div>
      <div id="previewArea" class="table-wrap hidden">
        <table>
          <thead>
            <tr><th>No.</th><th>日付</th><th>時間</th><th>分類</th><th>タイトル</th><th>色</th><th>元の行</th></tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </div>

    <div id="registrationCard" class="card hidden">
      <h2>登録結果</h2>
      <div id="registrationSummary" class="summary"></div>
      <div id="registrationMessages"></div>
      <div id="registrationArea" class="table-wrap hidden">
        <table>
          <thead>
            <tr><th>No.</th><th>日付</th><th>時間</th><th>分類</th><th>タイトル</th><th>結果</th></tr>
          </thead>
          <tbody id="registrationBody"></tbody>
        </table>
      </div>
    </div>

    <div id="deleteCard" class="card hidden">
      <h2>削除結果</h2>
      <div id="deleteSummary" class="summary"></div>
      <div id="deleteMessages"></div>
    </div>
  </div>

  <script>
    let appConfig = null;

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      document.getElementById('year').value = now.getFullYear();
      document.getElementById('deleteYear').value = now.getFullYear();
      document.getElementById('deleteMonth').value = now.getMonth() + 1;

      google.script.run.withSuccessHandler(function(config) {
        appConfig = config;
        renderCategories(config.categories);
      }).getConfig();

      google.script.run.withSuccessHandler(renderCalendars).getAvailableCalendars();
    });

    function renderCategories(categories) {
      document.getElementById('categoryArea').innerHTML = categories.map(function(item) {
        return '<label class="category-item">' +
          '<input type="checkbox" name="category" value="' + escapeHtml(item.name) + '" checked>' +
          '<span>' + escapeHtml(item.name) + '</span></label>';
      }).join('');
    }

    function renderCalendars(calendars) {
      document.getElementById('calendarSelect').innerHTML = calendars.map(function(item) {
        return '<option value="' + escapeHtml(item.id) + '"' + (item.isDefault ? ' selected' : '') + '>' +
          escapeHtml(item.name) + (item.isDefault ? '（デフォルト）' : '') + '</option>';
      }).join('');
    }

    function getSelectedCategories() {
      return Array.from(document.querySelectorAll('input[name="category"]:checked'))
        .map(function(item) { return item.value; });
    }

    function getSelectedCalendarId() {
      return document.getElementById('calendarSelect').value;
    }

    function runPreview() {
      setBusy(true, 'preview');
      google.script.run
        .withSuccessHandler(function(result) {
          setBusy(false, 'preview');
          renderPreview(result);
        })
        .withFailureHandler(function(error) {
          setBusy(false, 'preview');
          renderFailure(error, 'messages', 'resultCard');
        })
        .previewSchedule(
          document.getElementById('scheduleText').value,
          document.getElementById('year').value,
          getSelectedCategories()
        );
    }

    function runRegistration() {
      const text = document.getElementById('scheduleText').value;
      if (!text.trim()) {
        renderFailure({message: '勤務表を入力してください。'}, 'messages', 'resultCard');
        return;
      }
      if (!getSelectedCategories().length) {
        renderFailure({message: '登録対象カテゴリを1つ以上選択してください。'}, 'messages', 'resultCard');
        return;
      }
      if (!window.confirm('選択した予定をGoogleカレンダーへ登録します。よろしいですか？')) return;

      setBusy(true, 'register');
      google.script.run
        .withSuccessHandler(function(result) {
          setBusy(false, 'register');
          renderPreview(result.parsed);
          renderRegistration(result);
        })
        .withFailureHandler(function(error) {
          setBusy(false, 'register');
          renderFailure(error, 'registrationMessages', 'registrationCard');
        })
        .registerSchedule(
          text,
          document.getElementById('year').value,
          getSelectedCategories(),
          getSelectedCalendarId()
        );
    }

    function runMonthDelete() {
      const categories = getSelectedCategories();
      if (!categories.length) {
        renderFailure({message: '削除対象カテゴリを1つ以上選択してください。'}, 'deleteMessages', 'deleteCard');
        return;
      }

      const year = document.getElementById('deleteYear').value;
      const month = document.getElementById('deleteMonth').value;

      if (!window.confirm(year + '年' + month + '月の選択カテゴリ予定を削除します。よろしいですか？')) return;

      setBusy(true, 'delete');
      google.script.run
        .withSuccessHandler(function(result) {
          setBusy(false, 'delete');
          renderDeleteResult(result);
        })
        .withFailureHandler(function(error) {
          setBusy(false, 'delete');
          renderFailure(error, 'deleteMessages', 'deleteCard');
        })
        .deleteMonthSchedule(year, month, categories, getSelectedCalendarId());
    }

    function setBusy(busy, mode) {
      ['previewBtn', 'registerBtn', 'deleteBtn'].forEach(function(id) {
        document.getElementById(id).disabled = busy;
      });
      document.getElementById('previewBtn').textContent = busy && mode === 'preview' ? '解析中...' : 'プレビュー';
      document.getElementById('registerBtn').textContent = busy && mode === 'register' ? '登録中...' : 'Googleカレンダーへ登録';
      document.getElementById('deleteBtn').textContent = busy && mode === 'delete' ? '削除中...' : '選択カテゴリの予定を削除';
    }

    function renderPreview(result) {
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('summary').innerHTML =
        metric('解析', result.summary.parsed) +
        metric('エラー', result.summary.errors) +
        metric('警告', result.summary.warnings);

      const messages = [];
      if (result.errors.length) messages.push('<div class="error"><strong>エラー</strong><br>' + result.errors.map(formatMessage).join('<br>') + '</div>');
      if (result.warnings.length) messages.push('<div class="warning"><strong>警告</strong><br>' + result.warnings.map(formatMessage).join('<br>') + '</div>');
      if (!result.errors.length && result.events.length) messages.push('<div class="ok">解析に成功しました。</div>');
      document.getElementById('messages').innerHTML = messages.join('');

      document.getElementById('previewBody').innerHTML = result.events.map(function(event, index) {
        const time = event.allDay ? '終日' : event.start + '〜' + event.end;
        return '<tr><td>' + (index + 1) + '</td><td>' + escapeHtml(event.date) + '</td><td>' +
          escapeHtml(time) + '</td><td>' + escapeHtml(event.category) + '</td><td>' +
          escapeHtml(event.title) + '</td><td>' + escapeHtml(event.color) + '</td><td>' +
          escapeHtml(String(event.sourceLine)) + '</td></tr>';
      }).join('');

      document.getElementById('previewArea').classList.toggle('hidden', result.events.length === 0);
    }

    function renderRegistration(result) {
      const r = result.registration;
      document.getElementById('registrationCard').classList.remove('hidden');
      document.getElementById('registrationSummary').innerHTML =
        metric('対象', r.summary.requested) +
        metric('登録成功', r.summary.registered) +
        metric('重複スキップ', r.summary.skipped) +
        metric('登録失敗', r.summary.failed);

      let html = result.success
        ? '<div class="ok">' + escapeHtml(result.message) + '</div>'
        : '<div class="error">' + escapeHtml(result.message) + '</div>';

      if (r.skipped.length) {
        html += '<div class="warning"><strong>重複スキップ</strong><br>' +
          r.skipped.map(function(item) { return escapeHtml(item.date + ' ' + item.title); }).join('<br>') + '</div>';
      }
      if (r.failed.length) {
        html += '<div class="error"><strong>失敗内容</strong><br>' +
          r.failed.map(function(item) { return escapeHtml(item.date + ' ' + item.title + '／' + item.message); }).join('<br>') + '</div>';
      }
      document.getElementById('registrationMessages').innerHTML = html;

      const rows = [];
      r.registered.forEach(function(item) { rows.push(resultRow(item, '成功')); });
      r.skipped.forEach(function(item) { rows.push(resultRow(item, '重複スキップ')); });
      r.failed.forEach(function(item) { rows.push(resultRow(item, '失敗')); });

      document.getElementById('registrationBody').innerHTML = rows.map(function(row, index) {
        return '<tr><td>' + (index + 1) + '</td>' + row + '</tr>';
      }).join('');
      document.getElementById('registrationArea').classList.toggle('hidden', r.summary.requested === 0);
    }

    function resultRow(item, status) {
      const time = item.allDay ? '終日' : ((item.start || '-') + (item.end ? '〜' + item.end : ''));
      return '<td>' + escapeHtml(item.date || '-') + '</td><td>' + escapeHtml(time) + '</td><td>' +
        escapeHtml(item.category || '-') + '</td><td>' + escapeHtml(item.title || '-') + '</td><td>' +
        escapeHtml(status) + '</td>';
    }

    function renderDeleteResult(result) {
      document.getElementById('deleteCard').classList.remove('hidden');
      document.getElementById('deleteSummary').innerHTML =
        metric('確認', result.summary.scanned) +
        metric('削除', result.summary.deleted) +
        metric('対象外', result.summary.skipped) +
        metric('失敗', result.summary.failed);

      let html = result.success
        ? '<div class="ok">月単位削除が完了しました。</div>'
        : '<div class="error">一部の予定を削除できませんでした。</div>';

      if (result.failed.length) {
        html += '<div class="error">' + result.failed.map(function(item) {
          return escapeHtml(item.title + '／' + item.message);
        }).join('<br>') + '</div>';
      }
      document.getElementById('deleteMessages').innerHTML = html;
    }

    function renderFailure(error, messageId, cardId) {
      document.getElementById(cardId).classList.remove('hidden');
      document.getElementById(messageId).innerHTML =
        '<div class="error"><strong>実行エラー</strong><br>' +
        escapeHtml(error.message || String(error)) + '</div>';
    }

    function metric(label, value) {
      return '<div class="metric"><span>' + label + '</span><strong>' + value + '</strong></div>';
    }

    function formatMessage(item) {
      return '行' + item.line + '：' + escapeHtml(item.message) + '<br><small>' + escapeHtml(item.text) + '</small>';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function loadSample() {
      document.getElementById('scheduleText').value =
`【仕事】
7/1 09:00〜18:00 【仕事】早番
7/4 09:00〜18:00 【仕事】早番（在宅）

【休み】
7/3 休み

【有給】
7/8 有給休暇

【病院】
7/14 17:00〜17:30 【病院】歯医者

【美容】
7/28 10:00〜10:30 【美容】眉毛サロン

【私用】
7/16 終日 資産負債入力
7/21 09:00〜10:00 【私用】ディズニー`;
    }
  </script>
</body>
</html>
